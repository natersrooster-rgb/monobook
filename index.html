<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE BLUEPRINT</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- Header -->
        <header>
            <h1>TheMonoNetwork</h1>
        </header>

        <!-- Post Creator Box -->
        <section class="feed-input-box">
            <h2>Write to the network...</h2>
            <textarea id="postInput" placeholder="What are you thinking?"></textarea>
            <button id="postBtn">Broadcast</button>
        </section>

        <!-- Social Feed -->
        <section>
            <h2>Live Feed</h2>
            <div id="feed">
                <!-- JavaScript will inject posts here -->
            </div>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
