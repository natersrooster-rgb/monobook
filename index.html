<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TheMonoBook</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://w3.org viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📖</text></svg>">
</head>
<body>

    <div class="container">
        <!-- Header Matrix -->
        <header>
            <h1>monobook</h1>
            <!-- Feature: Personal Metric Grid -->
            <div class="stat-grid">
                <div class="stat-card">Handle: <span id="statHandle">@anonymous</span></div>
                <div class="stat-card">Total Network Likes: <span id="statLikes">0</span></div>
                <div class="stat-card">Followers: <span id="statFollowers">0</span></div>
            </div>
        </header>

        <!-- Configuration Matrix Row -->
        <section class="meta-controls">
            <div class="control-group">
                <h2>Identity Handle</h2>
                <input type="text" id="userInput" placeholder="@handle" value="@anonymous">
            </div>
            <div class="control-group">
                <h2>Filter #Hashtag</h2>
                <input type="text" id="filterInput" placeholder="Type tag to isolate...">
            </div>
        </section>

        <!-- Post Creator Box -->
        <section class="feed-input-box">
            <h2>Write to the network...</h2>
            <textarea id="postInput" placeholder="What are you thinking? Use #tags..."></textarea>
            
            <div class="input-actions">
                <!-- Unique Feature: Self-Destruct Decay Protocol Toggle -->
                <label class="decay-toggle">
                    <input type="checkbox" id="decayCheckbox"> 
                    <span>[!] DECAY PROTOCOL (2 min self-destruct)</span>
                </label>
                <div class="action-right">
                    <span id="charCount">0 / 280</span>
                    <button id="postBtn">Broadcast</button>
                </div>
            </div>
        </section>

        <!-- Social Feed Section -->
        <section>
            <div class="feed-header">
                <h2 id="feedTitle">Live Feed</h2>
                <button id="clearAllBtn" class="danger-btn">Wipe Node Records</button>
            </div>
            <div id="feed">
                <!-- JavaScript handles engine injections here -->
            </div>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
